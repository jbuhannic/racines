      banque: !!q.banque, accents: !!q.accents
    };
  },
  dessiner(etat){
    const compte = h('p',{class:'hint',id:'e-compte'});
    const maj = ()=>{ const r = lireTrous(etat.texte); compte.textContent = r.erreur ? r.erreur : r.reponses.length + ' trou' + (r.reponses.length > 1 ? 's' : '') + ' repéré' + (r.reponses.length > 1 ? 's' : '') + '.'; };
    maj();
    return [
      champ('Texte : entoure chaque mot à cacher avec des accolades','e-texte',
        h('textarea',{id:'e-texte',style:'min-height:200px',placeholder:'Rome fut fondée en {753} avant J.-C. par {Romulus|Romulus et Rémus}.',
          oninput:(ev)=>{ etat.texte = ev.target.value; maj(); }}, etat.texte)),
      compte,
      h('p',{class:'hint'},'Plusieurs réponses acceptées pour un même trou : sépare-les par | (barre verticale).'),
      h('label',{class:'opt'}, h('input',{type:'checkbox',id:'e-banque',checked:etat.banque,onchange:(ev)=>{ etat.banque = ev.target.checked; }}),
        h('span',{},'Afficher une banque de mots (les réponses, mélangées) pour aider l’élève')),
      h('label',{class:'opt'}, h('input',{type:'checkbox',id:'e-accents',checked:etat.accents,onchange:(ev)=>{ etat.accents = ev.target.checked; }}),
        h('span',{},'Tenir compte des accents (utile pour le grec)'))
    ];
  },
  valider(etat){ const r = lireTrous(etat.texte); return r.erreur || null; },
  serialiser(etat){
    const r = lireTrous(etat.texte);
    return {
      questions: { segments: r.segments, banque: etat.banque ? melanger(r.reponses.map(a => a[0])) : null, accents: etat.accents },
      corrige: { reponses: r.reponses },
      colonnes: {}
    };
  }
};

/* ---------- Mots mêlés ---------- */
const sigMeles = (e) => JSON.stringify([lignesNonVides(e.mots), e.taille, e.diff]);
function apercuMeles(g){
  const N = g.grille.length, sol = new Set();
  g.positions.forEach(p => { for(let i = 0; i < normLettres(p.mot).length; i++) sol.add((p.r + p.dr*i) + ',' + (p.c + p.dc*i)); });
  const cells = [];
  for(let r = 0; r < N; r++) for(let c = 0; c < N; c++) cells.push(h('div',{class:'cell ' + (sol.has(r + ',' + c) ? 'trouve' : '')}, g.grille[r][c]));
  return h('div',{},
    h('p',{class:'hint'},'Aperçu (grille de ' + N + ' × ' + N + ') : les mots cachés sont surlignés ici ; l’élève ne voit pas ce surlignage.'),
    h('div',{class:'grille',style:'grid-template-columns:repeat(' + N + ',1fr);max-width:' + (N * 38) + 'px'}, cells));
}
EDITEURS.meles = {

/* ---------- Mots fléchés ---------- */
function lireListeFleches(texte){
  const entrees = [], lignes = lignesNonVides(texte);
  for(let i = 0; i < lignes.length; i++){
    const k = lignes[i].indexOf('|');
    if(k < 0 || !lignes[i].slice(0,k).trim() || !lignes[i].slice(k+1).trim()) return { erreur: 'Ligne ' + (i+1) + ' : écris « mot | définition ».' };
    entrees.push({ mot: lignes[i].slice(0,k).trim(), def: lignes[i].slice(k+1).trim() });
  }
  return { entrees };
}
const sigFleches = (e) => JSON.stringify([lignesNonVides(e.liste), e.taille]);
function apercuFleches(g){
  const q = { lignes: g.lignes, colonnes: g.colonnes, indices: g.indices }, { indicesDeCase } = structureFleches(q);
  const cells = [];
  for(let r = 0; r < g.lignes; r++) for(let c = 0; c < g.colonnes; c++){
    const ch = g.lettres[r][c], k = r + ',' + c;
    if(ch !== '.') cells.push(h('div',{class:'fcell sol'}, ch));
    else if(indicesDeCase[k]) cells.push(h('div',{class:'fcell indice'}, rendreIndices(indicesDeCase[k])));
    else cells.push(h('div',{class:'fcell vide'}));
  }
  return h('div',{},
    h('p',{class:'hint'},'Aperçu (' + g.lignes + ' lignes × ' + g.colonnes + ' colonnes) : les lettres sont visibles ici, pas pour l’élève.'),
    h('div',{class:'fleches-wrap'}, h('div',{class:'fleches',style:'grid-template-columns:repeat(' + g.colonnes + ',var(--fc))'}, cells)));
}
EDITEURS.fleches = {
  init(ex, corrige){
    if(!ex) return { liste:'', taille:'auto', genere:null, erreurGen:'' };

    e.genere = { lignes: q.lignes, colonnes: q.colonnes, indices: q.indices || [], lettres: corrige.lettres || [], entrees: corrige.entrees || [], sig: sigFleches(e) };
    return e;
  },
  dessiner(etat, redessiner){
    const perime = etat.genere && etat.genere.sig !== sigFleches(etat);
    return [
      champ('Mots et définitions : un par ligne, sous la forme  mot | définition','e-liste',
        h('textarea',{id:'e-liste',style:'min-height:180px',placeholder:'Rome | Capitale de l’Empire\nForum | Place publique de la cité\nConsul | Magistrat élu pour un an',oninput:(ev)=>{ etat.liste = ev.target.value; }}, etat.liste)),
      h('p',{class:'hint'},'Choisis des mots qui partagent des lettres : la grille est construite en les croisant. Les définitions courtes (une dizaine de mots au plus) restent lisibles dans les cases.'),

        optionsSelect([['auto','Automatique'],['10','10'],['12','12'],['14','14'],['16','16']], etat.taille))),
      h('div',{class:'toolbar'}, h('button',{class:'btn ghost',type:'button',id:'e-gen',onclick:()=>{

      }}, etat.genere ? 'Générer une autre grille' : 'Générer la grille')),
      etat.erreurGen ? h('div',{class:'msg err',role:'alert'}, etat.erreurGen) : null,

    ];
  },
  valider(etat){
    if(!etat.genere || etat.genere.sig !== sigFleches(etat)) return 'Génère d’abord la grille avec le bouton « Générer la grille ».';
    return null;
  },
  serialiser(etat){
    const g = etat.genere;
    return {
      questions: { lignes: g.lignes, colonnes: g.colonnes, indices: g.indices, options: { taille: etat.taille } },
      corrige: { lettres: g.lettres, entrees: g.entrees },
      colonnes: {}
    };
  }
};

  function dessiner(){

      h('div',{class:'row2'},

          h('div',{class:'filters'}, dispo.map(g => h('label',{class:'opt'},
            h('input',{type:'checkbox',checked: fiche.groupes.includes(g),onchange:(ev)=>{
              fiche.groupes = ev.target.checked ? fiche.groupes.concat(g) : fiche.groupes.filter(x => x !== g);
              dessiner();
            }}), h('span',{}, g)))),
          h('p',{class:'sub'}, fiche.groupes.length ? 'Seuls ces groupes verront l’exercice.' : 'Aucun groupe coché : tous les groupes du niveau le voient.'));
      })(),
      h('div',{class:'row2'},
        champ('Titre','e-titre', h('input',{id:'e-titre',value:fiche.titre,oninput:(ev)=>{ fiche.titre = ev.target.value; }})),
        champ('Axe ou séquence (facultatif)','e-axe', h('input',{id:'e-axe',value:fiche.axe,oninput:(ev)=>{ fiche.axe = ev.target.value; }}))),
      champ('Consigne (facultatif)','e-consigne', h('textarea',{id:'e-consigne',oninput:(ev)=>{ fiche.consigne = ev.target.value; }}, fiche.consigne)),
      ED.dessiner(etat, dessiner),
      h('h2',{},'Publication'),
      h('div',{class:'row2'},
        champ('Place dans la liste (1, 2, 3…)','e-ordre', h('input',{id:'e-ordre',type:'number',value:String(fiche.ordre),oninput:(ev)=>{ fiche.ordre = ev.target.value; }}))),
      h('label',{class:'opt'},
        h('input',{type:'checkbox',id:'e-publie',checked: fiche.publie,onchange:(ev)=>{ fiche.publie = ev.target.checked; }}),
        h('span',{},'Publié : visible par les élèves des classes concernées'))
    ].flat(2).filter(Boolean));
  }

  bouton.addEventListener('click', async ()=>{
    const msg = (!fiche.titre.trim() ? 'Donne un titre à l’exercice.' : ED.valider(etat));
    if(msg) return erreur(msg);
    erreur(null);
    bouton.disabled = true;
    const s = ED.serialiser(etat);
    const ligne = Object.assign({
      type: fiche.type, niveau: fiche.niveau, groupes: fiche.groupes, axe: fiche.axe.trim(), titre: fiche.titre.trim(), consigne: fiche.consigne.trim(),
      extrait: '', source: '', ordre: Number(fiche.ordre) || 0, publie: fiche.publie, questions: s.questions
    }, s.colonnes || {});
    try{
      if(!fiche.id){
        const { data, error } = await sb.from('hlp_exercices').insert(ligne).select('id').single();
        if(error) throw error;
        fiche.id = data.id;
      } else {
        const { error } = await sb.from('hlp_exercices').update(ligne).eq('id', fiche.id);
        if(error) throw error;
      }
      const { error: e2 } = await sb.from('hlp_corriges').upsert({ exercice_id: fiche.id, corrige: s.corrige }, { onConflict: 'exercice_id' });
      if(e2) throw e2;
      flash = 'Exercice enregistré' + (fiche.publie ? ' et visible par les élèves concernés.' : ' en brouillon : les élèves ne le voient pas tant que tu ne le publies pas.');
      vueEnseignante('exercices');
    }catch(e){
      erreur('L’enregistrement a échoué. Vérifie ta connexion, et que les scripts supabase-niveaux.sql, supabase-types.sql et supabase-groupes.sql ont bien été exécutés dans Supabase.');
      bouton.disabled = false;
    }
  });

  dessiner();
  show(
    h('button',{class:'linkbtn back',onclick:()=>vueEnseignante('exercices')},'← Retour aux exercices'),
    h('h1',{}, ex ? 'Modifier l’exercice' : 'Nouvel exercice'),
    zone, zoneErreur,
    h('div',{class:'actions'}, bouton, h('button',{class:'btn ghost',type:'button',onclick:()=>vueEnseignante('exercices')},'Annuler')));
}

/* ---------- onglet « Résultats » ---------- */
async function ongletResultats(){
  const [ex, te, pr, co] = await Promise.all([
    sb.from('hlp_exercices').select('*').order('ordre',{ascending:true}),
    sb.from('hlp_tentatives').select('*').order('created_at',{ascending:false}),
    sb.from('profiles').select('id, prenom, nom, classe, role, hlp, niveau_hlp'),
    sb.from('hlp_corriges').select('exercice_id, corrige')
  ]);
  const err = ex.error || te.error || pr.error || co.error;
  if(err) throw err;
  const exos = ex.data || [], tent = te.data || [], profs = pr.data || [], cors = co.data || [];
  const eleve = {}; profs.forEach(p => eleve[p.id] = p);
  const exoPar = {}; exos.forEach(e => exoPar[e.id] = e);
  const corPar = {}; cors.forEach(c => corPar[c.exercice_id] = c.corrige);
  const actifs = profs.filter(p => p.role === 'eleve' && p.hlp);
  const officiels = [].concat(GROUPES['Première'], GROUPES['Terminale']);
  const autres = [...new Set(actifs.map(p => (p.classe || '').trim()).filter(c => c && !officiels.includes(c)))]
    .sort((a,b) => a.localeCompare(b, 'fr', {numeric:true}));
  function optionsGroupes(){
    const base = fNiv === '1re' ? GROUPES['Première'] : fNiv === 'tle' ? GROUPES['Terminale'] : officiels;
    return [h('option',{value:''},'Tous les groupes')]
      .concat(base.map(g => h('option',{value:g,selected: fGrp === g}, g)))
      .concat(autres.map(g => h('option',{value:g,selected: fGrp === g}, g + ' (à renommer)')));
  }
  function majMenuGroupes(){
    if(fGrp && !optionsGroupes().some(o => o.value === fGrp)) fGrp = '';
    selGrp.replaceChildren(...optionsGroupes());
  }
  let fExo = '', fNiv = '', fGrp = '';
  const selGrp = h('select',{id:'f-grp','aria-label':'Filtrer par groupe',onchange:(ev)=>{ fGrp = ev.target.value; tout(); }});
  const zoneTable = h('div',{class:'tablewrap'});
  const zoneResume = h('div',{});
  const garde = (p) => (!fNiv || p.niveau_hlp === fNiv) && (!fGrp || (p.classe || '').trim() === fGrp);

  function dessinerResume(){
    const sel = actifs.filter(garde);
    const ontFait = new Set(tent.filter(t => (!fExo || t.exercice_id === fExo)).map(t => t.eleve_id));
    const sansRien = sel.filter(p => !ontFait.has(p.id));
    zoneResume.replaceChildren(
      h('p',{class:'sub'}, sel.length + ' élève' + (sel.length > 1 ? 's' : '') + ' avec l’accès HLP · ' + (sel.length - sansRien.length) + ' ' + (sel.length - sansRien.length > 1 ? 'ont' : 'a') + ' fait ' + (fExo ? 'cet exercice' : 'au moins un exercice') + '.'),
      sansRien.length ? h('details',{}, h('summary',{}, 'Qui n’a encore rien fait ? (' + sansRien.length + ')'),
        h('p',{class:'sub'}, sansRien.map(p => p.prenom + ' ' + p.nom + (p.classe ? ' (' + p.classe + ')' : '')).join(', '))) : null);
  }

  function dessinerTable(){
    const lignes = tent.filter(t=>{
      const p = eleve[t.eleve_id]; if(!p) return false;
      if(fExo && t.exercice_id !== fExo) return false;
      return garde(p);
    });
    if(!lignes.length){ zoneTable.replaceChildren(h('p',{class:'empty'},'Aucun résultat pour le moment.')); return; }
    zoneTable.replaceChildren(h('table',{class:'res'},
      h('thead',{}, h('tr',{}, ['Élève','Groupe','Exercice','Date','Résultat'].map(c => h('th',{},c)))),
      h('tbody',{}, lignes.map(t=>{
        const p = eleve[t.eleve_id], e = exoPar[t.exercice_id];
        let res = '—';
        const s = e ? scoreExercice(e, corPar[e.id], t.reponses) : null;
        if(s) res = s.ok + ' / ' + s.total;
        else if(e && e.type === 'analyse'){
          res = h('details',{}, h('summary',{},'Voir les réponses'),
            (Array.isArray(e.questions) ? e.questions : []).map((q,i)=> h('div',{class:'rep'}, h('strong',{}, (i+1) + '. ' + q.q), h('div',{}, (t.reponses || {})[i] || '—'))));
        }
        return h('tr',{},
          h('td',{}, p.nom + ' ' + p.prenom), h('td',{}, p.classe || ''),
          h('td',{}, e ? e.titre : '(exercice supprimé)'), h('td',{}, fmtDateHeure(t.created_at)), h('td',{}, res));
      }))));
  }
  function tout(){ dessinerResume(); dessinerTable(); }
  tout();

  cadreEnseignante('resultats',
    zoneResume,
    h('div',{class:'filters'},
      h('select',{id:'f-exo','aria-label':'Filtrer par exercice',onchange:(ev)=>{ fExo = ev.target.value; tout(); }},
        h('option',{value:''},'Tous les exercices'), exos.map(e => h('option',{value:e.id}, e.titre))),
      h('select',{id:'f-niv','aria-label':'Filtrer par niveau',onchange:(ev)=>{ fNiv = ev.target.value; majMenuGroupes(); tout(); }},
        h('option',{value:''},'Première et Terminale'), h('option',{value:'1re'},'Première'), h('option',{value:'tle'},'Terminale')),
      selGrp),
    zoneTable);
  majMenuGroupes();
}

demarrer();
</script>
